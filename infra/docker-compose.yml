version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: radius-postgres
    restart: always
    environment:
      POSTGRES_USER: radius_user
      POSTGRES_PASSWORD: radius_password
      POSTGRES_DB: radius_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radius_user -d radius_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: radius-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: radius-backend
    restart: always
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://radius_user:radius_password@postgres:5432/radius_db
      JWT_SECRET: super-secret-jwt-key-for-radius-2026
      JWT_REFRESH_SECRET: super-secret-refresh-key-for-radius-2026
      STRIPE_SECRET_KEY: sk_test_mock_stripe_key
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio_admin
      S3_SECRET_KEY: minio_password
      S3_BUCKET: radius-uploads
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    container_name: radius-admin
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000

volumes:
  pgdata:
  miniodata:
